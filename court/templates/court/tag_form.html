{% extends 'court/base.html' %}

{% block title %}Add Tag | Unpopular Opinions Court{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">

    <h1 class="page-title">&gt; ADD NEW TAG</h1>

    <form method="POST" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    {{ field.errors }}
                {% endif %}
            </div>
        {% endfor %}
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn">ADD TAG</button>
            <a href="{% url 'tag-list' %}" class="btn btn-danger">CANCEL</a>
        </div>
    </form>

</div>
{% endblock %}
